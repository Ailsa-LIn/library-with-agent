<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>基于 Agent 的图书进销存系统</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}?v=20260601-5" />
  </head>
  <body>
    <header class="app-header">
      <div>
        <h1>基于 Agent 的图书进销存系统</h1>
        <p>传统管理台与自然语言操作入口</p>
      </div>
      <div class="header-actions">
        <button id="refreshBtn" class="icon-btn" title="刷新数据" type="button">↻</button>
      </div>
    </header>

    <main class="layout">
      <section class="workspace">
        <section class="panel">
          <div class="panel-title">
            <h2>图书管理</h2>
          </div>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>书名</th>
                  <th>作者</th>
                  <th>分类</th>
                  <th>价格</th>
                  <th>库存</th>
                  <th>已售</th>
                </tr>
              </thead>
              <tbody id="booksTbody"></tbody>
            </table>
          </div>
        </section>

        <section>
          <div class="panel">
            <h2>数据统计</h2>
            <div class="stat-lists">
              <div>
                <h3>销量排行</h3>
                <ol id="topSalesList"></ol>
              </div>
              <div>
                <h3>库存预警</h3>
                <ul id="lowStockList"></ul>
              </div>
            </div>
          </div>
        </section>
      </section>

      <aside class="agent-panel">
        <div class="agent-header">
          <div>
            <h2>Agent 对话</h2>
            <p>输入目标，系统自动选择工具函数</p>
          </div>
          <span id="agentStatus">就绪</span>
        </div>

        <div id="chatLog" class="chat-log"></div>

        <form id="agentForm" class="agent-form">
          <textarea id="agentInput" rows="3" placeholder="例如：把《C++ Primer》的库存增加 20 本"></textarea>
          <button type="submit">发送</button>
        </form>
      </aside>
    </main>

    <div id="toast" class="toast" hidden></div>
    <script src="{{ url_for('static', filename='app.js') }}?v=20260601-5"></script>
  </body>
</html>
