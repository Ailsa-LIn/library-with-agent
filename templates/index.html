<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>基于 Agent 的图书进销存系统</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}?v=20260601-13" />
  </head>
  <body>
    <header class="app-header">
      <div>
        <h1>基于 Agent 的图书进销存系统</h1>
      </div>
      <div class="header-actions">
        <button id="refreshBtn" class="icon-btn" title="刷新数据" type="button">↻</button>
      </div>
    </header>

    <main class="layout">
      <section class="workspace">
        <section class="panel">
          <div class="panel-title">
            <h2>图书库存</h2>
          </div>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>书名</th>
                  <th>作者</th>
                  <th>分类</th>
                  <th>价格</th>
                  <th>库存</th>
                  <th>已售</th>
                </tr>
              </thead>
              <tbody id="booksTbody"></tbody>
            </table>
          </div>
        </section>

        <section>
          <div class="panel">
            <div class="stat-lists">
              <div>
                <h3>销量排行</h3>
                <ol id="topSalesList"></ol>
              </div>
              <div>
                <h3>库存预警</h3>
                <ul id="lowStockList"></ul>
              </div>
            </div>
          </div>
        </section>
      </section>

      <aside class="agent-panel">
        <div class="agent-header">
          <div>
            <h2>Agent 对话</h2>
            <div class="agent-shortcuts">
              <button type="button" data-template="query">查询</button>
              <button type="button" data-template="add">添加</button>
              <button type="button" data-template="purchase">进货</button>
              <button type="button" data-template="sale">销售</button>
              <button id="shortcutToggle" class="shortcut-toggle" type="button" aria-expanded="false">展开显示</button>
              <button class="shortcut-extra" type="button" data-template="lowStock" hidden>库存预警</button>
              <button class="shortcut-extra" type="button" data-template="topSales" hidden>销量排行</button>
              <button class="shortcut-extra" type="button" data-template="stockIncrease" hidden>增加库存</button>
              <button class="shortcut-extra" type="button" data-template="stockDecrease" hidden>减少库存</button>
              <button class="shortcut-extra" type="button" data-template="stockSet" hidden>设置库存</button>
              <button class="shortcut-extra" type="button" data-template="changePrice" hidden>改价格</button>
              <button class="shortcut-extra" type="button" data-template="changeAuthor" hidden>改作者</button>
              <button class="shortcut-extra" type="button" data-template="changeCategory" hidden>改分类</button>
              <button class="shortcut-extra" type="button" data-template="renameBook" hidden>改书名</button>
              <button class="shortcut-extra" type="button" data-template="deleteBook" hidden>删除</button>
            </div>
          </div>
        </div>

        <div id="chatLog" class="chat-log"></div>

        <form id="agentForm" class="agent-form">
          <textarea id="agentInput" rows="3" placeholder="例如：把《C++ Primer》的库存增加 20 本"></textarea>
          <button type="submit">发送</button>
        </form>
      </aside>
    </main>

    <div id="toast" class="toast" hidden></div>
    <script src="{{ url_for('static', filename='app.js') }}?v=20260601-13"></script>
  </body>
</html>
